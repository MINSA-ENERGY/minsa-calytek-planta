<!-- Corre la app REAL (index.html + app.js) contra un Graph FALSO en memoria y un MSAL falso, y
     recorre los escenarios de docs/plan.md § Verificación mas los de la auditoria del 2026-09-05.
     Sin CSP a proposito (es herramienta de desarrollo, no se publica). Se corre asi:

       node servidor-local.js test/pruebas.html          (vive en app/test/ desde v0.19.4)
       msedge --headless=new --virtual-time-budget=30000 --dump-dom http://localhost:8080/?rol=gerencia

     Modo SOLO MIRAR (obs. 569): `?rol=gerencia&vista=puerta` oculta este <pre> al terminar la
     corrida y deja abierta esa pestana (puerta · bascula · hoy · padron · prealtas), asi la captura
     headless muestra la UI y no el log:
       msedge --headless=new --virtual-time-budget=30000 --window-size=1280,900 --screenshot=captura.png "http://localhost:8080/?rol=gerencia&vista=puerta"

     El resultado queda en <pre id="resultados"> y se manda a POST /guardar (_salida-dev.json).
     El Graph falso VALIDA los valores de columnas choice contra esquema.json, como SharePoint:
     escribir una opcion que no existe da 400. Eso es lo que hace visible una columna sin actualizar. -->
<style>
  body { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  #resultados { white-space: pre-wrap; background: #111; color: #ddd; padding: 1rem; }
  #resultados .ok { color: #7fd48a; } #resultados .falla { color: #ff7b6b; font-weight: 700; } #resultados .nota { color: #ffd166; }

<body>
<pre id="resultados">arrancando…</pre>
<div id="app-real"></div>

<script src="./vendor/qrcode.js"></script>   <!-- v0.35.0: el QR del certificado; la app lo toma de window.qrcode -->
<script>
// ------------------------------------------------------------------ MSAL falso
(function () {
    const params = new URLSearchParams(location.search);
    const cuenta = { username: params.get('quien') || 'gerencia@example.invalid', homeAccountId: 'x' };
    class PublicClientApplication {
        constructor(cfg) { this.cfg = cfg; }
        async initialize() {}
        async handleRedirectPromise() { return null; }
        getAllAccounts() { return [cuenta]; }
        async acquireTokenSilent() { return { accessToken: 'token-falso' }; }
        async loginRedirect() { window.__PRUEBAS.log('nota', 'loginRedirect llamado'); }
        async logoutRedirect() { window.__PRUEBAS.log('nota', 'logoutRedirect llamado'); }
    }
    class InteractionRequiredAuthError extends Error { constructor(m) { super(m); this.errorCode = 'interaction_required'; } }
    // S-13: el bundle real exporta CacheLookupPolicy y app.js lo usa en acquireTokenSilent; el falso lo expone con los mismos valores.
    const CacheLookupPolicy = { Default: 0, AccessToken: 1, AccessTokenAndRefreshToken: 2, RefreshToken: 3, RefreshTokenAndNetwork: 4, Skip: 5 };
    window.msal = { PublicClientApplication, InteractionRequiredAuthError, CacheLookupPolicy };
    window.__CUENTA = cuenta;
    // Sin service worker en las pruebas: un controllerchange recargaria la pagina a media corrida.
    Object.defineProperty(navigator, 'serviceWorker', { configurable: true, value: {
        controller: null, addEventListener() {}, register() { return Promise.resolve({ update() {} }); }
    } });
    // confirm() nativo (si la version bajo prueba aun lo usa): siempre si.
    window.confirm = () => true;
})();

// ------------------------------------------------------------------ Graph falso
(function () {
    const fetchReal = window.fetch.bind(window);
    const G = 'https://graph.microsoft.com/v1.0';
    const DB = { listas: {}, carpetas: [], archivos: [], siguienteId: 1, esquema: null, fallas: [], llamadas: [], filtros: [], textoLargo: [] };
    window.__DB = DB;

    function lista(id) { for (const l of Object.values(DB.listas)) if (l.id === id) return l; return null; }
    function json(status, cuerpo) {
        return new Response(cuerpo === undefined ? null : JSON.stringify(cuerpo), { status, headers: { 'Content-Type': 'application/json' } });
    }
    // C-15 (v0.27.0): error.code como lo devuelve Graph por status (obs. 604: el falso reproduce los TIPOS del servicio).
    const CODIGO = { 400: 'invalidRequest', 401: 'InvalidAuthenticationToken', 403: 'accessDenied', 404: 'itemNotFound', 429: 'activityLimitReached', 500: 'generalException' };
    function error(status, mensaje) { return json(status, { error: { code: CODIGO[status] || 'falso', message: mensaje } }); }
    function validarChoices(l, campos) {
        const esq = DB.esquema.listas.find(x => x.nombre === l.nombre);
        for (const c of esq.columnas) {
            if (c.tipo === 'choice' && campos[c.nombre] !== undefined && campos[c.nombre] !== null && !c.opciones.includes(campos[c.nombre]))
                return `El valor "${campos[c.nombre]}" no es una opción de la columna ${c.nombre} (choice sin allowTextEntry)`;
            // SharePoint: texto de una linea = 255; pasarse es un 400 «Invalid request» sin mas detalle. Mordio en
            // minsa-proyectos (2026-09-12, webUrl de 268) con 251 pruebas en verde: el falso solo rechaza lo que
            // alguien le enseno a rechazar, y cada limite que muerde en una app entra el mismo dia en el falso
            // de la otra (obs. 588). La corrida exige DB.textoLargo vacio al cerrar.
            if (c.tipo === 'text' && typeof campos[c.nombre] === 'string' && campos[c.nombre].length > 255) { DB.textoLargo.push(`${l.nombre}.${c.nombre}=${campos[c.nombre].length}`); return 'Invalid request'; }
        }
        return null;
    }
    function item(it) { return { id: String(it.id), fields: { ...it.fields, id: String(it.id) } }; }

    // Subconjunto de OData que la app usa de verdad: `fields/X op valor` unidos por or/and, sin
    // parentesis. Se implementa aqui a proposito: antes el Graph falso IGNORABA $filter y devolvia
    // la lista entera, asi que una prueba de carga acotada habria pasado sin acotar nada.
    const OPS = {
        eq: (a, b) => String(a ?? '') === String(b),
        ne: (a, b) => String(a ?? '') !== String(b),
        ge: (a, b) => String(a ?? '') >= String(b),
        gt: (a, b) => String(a ?? '') > String(b),
        le: (a, b) => String(a ?? '') <= String(b),
        lt: (a, b) => String(a ?? '') < String(b)
    };
    function odata(filtro, campos) {
        const orS = filtro.split(/\s+or\s+/i);
        return orS.some(t => t.split(/\s+and\s+/i).every(c => {
            const m = /^\s*fields\/([A-Za-z0-9_]+)\s+(eq|ne|ge|gt|le|lt)\s+(.+?)\s*$/.exec(c);
            if (!m) throw new Error('clausula no soportada: ' + c);
            const crudo = m[3].trim();
            const valor = /^'.*'$/.test(crudo) ? crudo.slice(1, -1) : crudo;
            return OPS[m[2]](campos[m[1]], valor);
        }));
    }

    window.fetch = async function (url, opts = {}) {
        const u = String(url);
        if (!u.startsWith(G)) return fetchReal(url, opts);
        const metodo = (opts.method || 'GET').toUpperCase();
        const ruta = u.slice(G.length);
        DB.llamadas.push(`${metodo} ${ruta}`);
        // Falla inyectada: { metodo, incluye, status, veces }
        const f = DB.fallas.find(x => x.metodo === metodo && ruta.includes(x.incluye) && x.veces > 0);
        if (f) { f.veces--; return error(f.status, `falla inyectada (${f.incluye})`); }

        let m;
        if ((m = /^\/sites\/([^/]+):(\/[^?]+)$/.exec(ruta)) && metodo === 'GET') return json(200, { id: 'sitio-falso' });
        if (/^\/sites\/sitio-falso\/lists\?/.test(ruta) && metodo === 'GET') {
            // S-07 (v0.25.0): /lists sale SIEMPRE en dos paginas con @odata.nextLink, PLANTA_Firmas en la segunda: un
            // cliente que se quede con la primera (como graph.js hasta v0.24.0) no encuentra la lista y la app lo delata.
            const todas = Object.values(DB.listas).map(l => ({ id: l.id, name: l.nombre, displayName: l.nombre }));
            const corte = Math.max(1, todas.length - 1);
            if (/[&?]pagina=2/.test(ruta)) return json(200, { value: todas.slice(corte) });
            return json(200, { value: todas.slice(0, corte), '@odata.nextLink': `${G}/sites/sitio-falso/lists?$select=id,name,displayName&$top=200&pagina=2` });
        }
        if ((m = /^\/sites\/sitio-falso\/lists\/([^/]+)\/items\/(\d+)\?/.exec(ruta)) && metodo === 'GET') {
            const l = lista(m[1]); const it = l && l.items.find(x => x.id === Number(m[2]));
            if (!it) return error(404, 'renglón');
            return json(200, item(it));
        }
        if ((m = /^\/sites\/sitio-falso\/lists\/([^/]+)\/items\?/.exec(ruta)) && metodo === 'GET') {
            const l = lista(m[1]); if (!l) return error(404, 'lista');
            const f = new URLSearchParams(ruta.slice(ruta.indexOf('?'))).get('$filter');
            let items = l.items;
            if (f) {
                DB.filtros.push(f);
                try { items = items.filter(it => odata(f, it.fields)); }
                catch (e) { return error(400, 'el Graph falso no entiende el $filter: ' + f); }
            }
            return json(200, { value: items.map(item) });
        }
        if ((m = /^\/sites\/sitio-falso\/lists\/([^/]+)\/items$/.exec(ruta)) && metodo === 'POST') {
            const l = lista(m[1]); if (!l) return error(404, 'lista');
            const campos = JSON.parse(opts.body).fields;
            const mal = validarChoices(l, campos); if (mal) return error(400, mal);
            const it = { id: DB.siguienteId++, fields: { ...campos } };
            l.items.push(it);
            return json(201, item(it));
        }
        if ((m = /^\/sites\/sitio-falso\/lists\/([^/]+)\/items\/(\d+)\/fields$/.exec(ruta)) && metodo === 'PATCH') {
            const l = lista(m[1]); const it = l && l.items.find(x => x.id === Number(m[2]));
            if (!it) return error(404, 'renglón');
            const campos = JSON.parse(opts.body);
            const mal = validarChoices(l, campos); if (mal) return error(400, mal);
            Object.assign(it.fields, campos);
            return json(200, it.fields);
        }
        if ((m = /^\/sites\/sitio-falso\/lists\/([^/]+)\/items\/(\d+)$/.exec(ruta)) && metodo === 'DELETE') {
            const l = lista(m[1]); const i = l ? l.items.findIndex(x => x.id === Number(m[2])) : -1;
            if (i < 0) return error(404, 'renglón');
            l.items.splice(i, 1);
            return new Response(null, { status: 204 });
        }
        if ((m = /^\/sites\/sitio-falso\/drive\/root:\/(.+):\/children$/.exec(ruta)) && metodo === 'POST') {
            const cuerpo = JSON.parse(opts.body);
            let nombre = cuerpo.name; let n = 1;
            while (DB.carpetas.find(c => c.ruta === decodeURIComponent(m[1]) + '/' + nombre)) nombre = `${cuerpo.name} ${++n}`;
            const c = { id: 'carpeta-' + DB.siguienteId++, ruta: decodeURIComponent(m[1]) + '/' + nombre, nombre };
            DB.carpetas.push(c);
            return json(201, { id: c.id, name: nombre });
        }
        if ((m = /^\/sites\/sitio-falso\/drive\/root:\/(.+):\/content$/.exec(ruta)) && metodo === 'PUT') {
            const ruta2 = decodeURIComponent(m[1]);
            const carpeta = ruta2.slice(0, ruta2.lastIndexOf('/'));
            if (!DB.carpetas.find(c => c.ruta === carpeta)) return error(404, 'la carpeta no existe: ' + carpeta);
            DB.archivos.push({ ruta: ruta2, bytes: opts.body ? (opts.body.byteLength || opts.body.length || 0) : 0 });
            return json(201, { name: ruta2.slice(ruta2.lastIndexOf('/') + 1) });
        }
        // v0.33.0 (Archivos): la biblioteca (webUrl) y los hijos de una carpeta por ruta, como los devuelve Graph
        // (folder.childCount / file, size, lastModifiedDateTime, webUrl). Una carpeta que no esta sembrada ni creada es 404.
        if (/^\/sites\/sitio-falso\/drive\?/.test(ruta) && metodo === 'GET') return json(200, { id: 'drive-falso', webUrl: 'https://tenant.example.invalid/sites/Ambiental-CALYTEK/Documentos%20compartidos' });
        if ((m = /^\/sites\/sitio-falso\/drive\/root:\/(.+):\/children\?/.exec(ruta)) && metodo === 'GET') {
            const padre = decodeURIComponent(m[1]);
            if (!DB.carpetas.find(c => c.ruta === padre)) return error(404, 'la carpeta no existe: ' + padre);
            const hijoDe = (p, r) => r.startsWith(p + '/') && !r.slice(p.length + 1).includes('/');
            const cuantos = p => DB.carpetas.filter(c => hijoDe(p, c.ruta)).length + DB.archivos.filter(a => hijoDe(p, a.ruta)).length;
            const value = [
                ...DB.carpetas.filter(c => hijoDe(padre, c.ruta)).map(c => ({ id: c.id, name: c.nombre, folder: { childCount: cuantos(c.ruta) }, lastModifiedDateTime: c.fecha || '2026-09-20T15:00:00Z', webUrl: 'https://tenant.example.invalid/' + c.ruta })),
                ...DB.archivos.filter(a => hijoDe(padre, a.ruta)).map(a => ({ id: 'archivo-' + a.ruta, name: a.ruta.slice(padre.length + 1), size: a.bytes, file: { mimeType: 'application/octet-stream' }, lastModifiedDateTime: a.fecha || '2026-09-20T15:00:00Z', webUrl: 'https://tenant.example.invalid/' + a.ruta }))
            ];
            return json(200, { value });
        }
        if ((m = /^\/sites\/sitio-falso\/drive\/(?:items\/([^/]+)|root:\/(.+))$/.exec(ruta)) && metodo === 'DELETE') {
            const c = m[1] ? DB.carpetas.find(x => x.id === m[1]) : DB.carpetas.find(x => x.ruta === decodeURIComponent(m[2]));
            if (!c) return error(404, 'carpeta');
            DB.carpetas = DB.carpetas.filter(x => x !== c);
            DB.archivos = DB.archivos.filter(a => !a.ruta.startsWith(c.ruta + '/'));
            return new Response(null, { status: 204 });
        }
        return error(500, `el Graph falso no conoce ${metodo} ${ruta}`);
    };

    window.__sembrar = function (esquema, rol) {
        DB.esquema = esquema;
        for (const l of esquema.listas) DB.listas[l.clave] = { id: 'lista-' + l.clave, nombre: l.nombre, items: [] };
        const roles = DB.listas.roles.items;
        roles.push({ id: DB.siguienteId++, fields: { Title: window.__CUENTA.username, Nombre: 'Prueba', Rol: rol, Activo: true } });
        roles.push({ id: DB.siguienteId++, fields: { Title: 'validador@example.invalid', Nombre: 'Validadora', Rol: 'validador', Activo: true } });
        roles.push({ id: DB.siguienteId++, fields: { Title: 'gerente@example.invalid', Nombre: 'Gerente', Rol: 'gerencia', Activo: true } });   // S-11 (v0.28.0)
        // v0.33.0 (Archivos): la biblioteca con las tres ramas que la seccion lee. Nombres del contrato de la casa, sin datos
        // reales (repo publico). El lote sembrado es de OTRO ano (e-25-00042) para que no choque con los folios de la corrida.
        const carpeta = (ruta, fecha) => DB.carpetas.push({ id: 'carpeta-' + DB.siguienteId++, ruta, nombre: ruta.slice(ruta.lastIndexOf('/') + 1), fecha });
        const archivo = (ruta, bytes, fecha) => DB.archivos.push({ ruta, bytes, fecha });
        for (const r of ['02_Planta', '02_Planta/Bascula', '02_Planta/Bascula/2025', '02_Planta/Bascula/2025/2025-11', '02_Planta/Bascula/2025/2025-11/2025-11-03_Embarque_bruto-e-25-00042-31200-kg']) carpeta(r, '2025-11-03T16:00:00Z');
        archivo('02_Planta/Bascula/2025/2025-11/2025-11-03_Embarque_bruto-e-25-00042-31200-kg/2025-11-03_CALYTEK_Foto_bruto-e-25-00042-31200-kg-01.jpg', 1150000, '2025-11-03T16:02:00Z');
        archivo('02_Planta/Bascula/2025/2025-11/2025-11-03_Embarque_bruto-e-25-00042-31200-kg/2025-11-03_CALYTEK_Ticket_E-25-00042_DEMO-01.pdf', 84000, '2025-11-03T16:40:00Z');
        archivo('02_Planta/Bascula/2025/2025-11/2025-11-03_Embarque_bruto-e-25-00042-31200-kg/_lote.json', 512, '2025-11-03T16:02:00Z');
        for (const r of ['04_SGI', '04_SGI/02_Ambiental', '04_SGI/02_Ambiental/Permisos-y-Autorizaciones']) carpeta(r, '2025-03-14T12:00:00Z');
        archivo('04_SGI/02_Ambiental/Permisos-y-Autorizaciones/2025-03-14_ASEA_Oficio-UGI-DEMO-0000-2025_Transportes-Demo.pdf', 2400000, '2025-03-14T12:00:00Z');
        archivo('04_SGI/02_Ambiental/Permisos-y-Autorizaciones/2026-01-09_SAT_CSF_Transportes-Demo.pdf', 310000, '2026-01-09T12:00:00Z');
        carpeta('99_Pendiente-Archivar', '2026-09-01T12:00:00Z');
        // S-15 (v0.34.0): el buzon trae ademas lo que Carlos deposita para /archivar-calytek; la app NO lo lista.
        carpeta('99_Pendiente-Archivar/2026-09-18_Fianza-ASEA_borrador', '2026-09-18T12:00:00Z');
        archivo('99_Pendiente-Archivar/2026-09-18_MINSA_Contrato_Transportes-Demo.pdf', 420000, '2026-09-18T12:00:00Z');
    };
})();

// ------------------------------------------------------------------ bitacora de resultados
(function () {
    const pre = document.getElementById('resultados');
    const R = { lineas: [], fallas: 0, oks: 0 };
    R.log = (clase, texto) => {
        const s = document.createElement('span'); s.className = clase; s.textContent = `[${clase.toUpperCase()}] ${texto}\n`; pre.appendChild(s);
        R.lineas.push(`[${clase}] ${texto}`);
    };
    R.ok = (nombre, cond, detalle) => { if (cond) { R.oks++; R.log('ok', nombre + (detalle ? ' — ' + detalle : '')); } else { R.fallas++; R.log('falla', nombre + (detalle ? ' — ' + detalle : '')); } };
    R.cerrar = async () => {
        const resumen = `${R.oks} ok · ${R.fallas} falla(s)`;
        R.log(R.fallas ? 'falla' : 'ok', 'RESUMEN: ' + resumen);
        document.title = 'PRUEBAS TERMINADAS: ' + resumen;
        try { await fetch('/guardar', { method: 'POST', body: JSON.stringify({ resumen, lineas: R.lineas, llamadas: window.__DB.llamadas.length }, null, 1) }); } catch (_) {}
    };
    window.__PRUEBAS = R;
})();
</script>

<script type="module">
const R = window.__PRUEBAS;
const DB = window.__DB;
const params = new URLSearchParams(location.search);
const ROL = params.get('rol') || 'gerencia';
const $ = id => document.getElementById(id);
const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperar(fn, que, ms = 8000) {
    const t0 = Date.now();
    while (Date.now() - t0 < ms) { try { const v = fn(); if (v) return v; } catch (_) {} await dormir(25); }
    throw new Error('tiempo agotado esperando: ' + que);
}
const visible = id => $(id).tagName === 'DIALOG' ? $(id).open : !$(id).classList.contains('oculto') && !$(id).hidden;
const avisoCon = texto => [...document.querySelectorAll('#avisos .mensaje')].find(m => m.textContent.includes(texto));
const clic = id => $(id).click();
const poner = (id, v) => { $(id).value = v; $(id).dispatchEvent(new Event('input', { bubbles: true })); $(id).dispatchEvent(new Event('change', { bubbles: true })); };
const elegirPorTexto = (id, texto) => { const o = [...$(id).options].find(x => x.textContent.includes(texto)); if (!o) throw new Error(`no hay opción "${texto}" en ${id}`); poner(id, o.value); };
const filas = clave => DB.listas[clave].items;
async function foto() {
    const c = document.createElement('canvas'); c.width = 64; c.height = 48;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#333'; ctx.fillRect(0, 0, 64, 48); ctx.fillStyle = '#0f0'; ctx.fillText('44600', 5, 30);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .8));
    const dt = new DataTransfer(); dt.items.add(new File([blob], 'indicador.jpg', { type: 'image/jpeg' }));
    $('baFotoEntrada').files = dt.files; $('baFotoEntrada').dispatchEvent(new Event('change', { bubbles: true }));
    // Instrumentado (obs. 603, 2026-09-20): si no aparece, decir QUIEN fallo — la app (aviso «No se pudo leer la foto») o
    // el arnes (createImageBitmap / toBlob son trabajo REAL y el reloj virtual sigue corriendo mientras tanto).
    const t0 = Date.now();
    try { await esperar(() => visible('baFotoPrevia'), 'foto previa'); }
    catch (e) {
        const av = avisoCon('No se pudo leer la foto');
        throw new Error(av ? `foto previa: la APP fallo: ${av.textContent}` : `foto previa: sin error de la app tras ${Date.now() - t0} ms virtuales: la decodificacion real no alcanzo al reloj virtual`);
    }
}
/**
 * v0.33.0: la seccion Archivos sobre la biblioteca sembrada (+ el lote del buzon que subio la corrida, si `emb1`). Cada
 * carpeta se lee al abrirla: se abre por codigo y se espera al DOM, no al dato. Deja los filtros vacios y vuelve a Hoy.
 */
async function probarArchivos(emb1) {
    const arbol = () => $('arArbol');
    const abrir = async (sel, que) => { const d = await esperar(() => arbol().querySelector(sel), 'carpeta ' + que); d.open = true; await esperar(() => d.querySelector(':scope > .hijos > details, :scope > .hijos > .arch, :scope > .hijos > .vacio:not(:empty)') && !d.querySelector(':scope > .hijos > .vacio')?.textContent.startsWith('Leyendo'), 'hijos de ' + que); return d; };
    const oculto = x => !x || x.classList.contains('oculto') || !!x.closest('.oculto');
    const gets0 = DB.llamadas.filter(x => x.startsWith('GET /sites/sitio-falso/drive/root:')).length;
    document.querySelector('#pestanasExtra button[data-p="archivos"]').click();
    R.ok('v0.33.0: «Archivos» vive en la sección aparte del rail y abre #p-archivos con su cabecera', visible('p-archivos') && document.querySelector('#pestanasExtra button[data-p="archivos"]').getAttribute('aria-current') === 'page' && $('p-archivos').querySelector('.cabecera .titulo-ico') !== null);
    await esperar(() => arbol().querySelectorAll(':scope > details').length === 3, 'las tres ramas');
    await esperar(() => $('lnkArchivosSharePoint').href.includes('example.invalid'), 'webUrl de la biblioteca');

            URL.revokeObjectURL = revokeC27;
            document.querySelector('#pestanas button[data-p="bascula"]').click();
            R.ok('C-27: al descartar se suelta la foto (blob URL revocado) y, de vuelta en Báscula, la tarjeta no reaparece; la góndola sigue esperando la tara', revocadosC27 >= 1 && !visible('baPesar') && $('baLista').textContent.includes(e112.fields.Title) && !e112.fields.TaraKg, `revocados ${revocadosC27}`);
            // Sin nada capturado, cambiar de pestana no pregunta (como Cancelar vacio).
            [...document.querySelectorAll('#baLista .renglon')].find(r => r.textContent.includes(e112.fields.Title)).querySelector('button').click();
            await esperar(() => visible('baPesar'), 'tara 112 abierta otra vez');
            document.querySelector('#pestanas button[data-p="hoy"]').click();
            R.ok('C-27: con el pesaje vacío cambiar de pestaña no pregunta y sale directo', !$('dlg').open && visible('p-hoy'));
            document.querySelector('#pestanas button[data-p="bascula"]').click();
            // C-23: Anular desde Bascula con el confirm abierto; Actualizar en medio no debe recargar ni cerrar el dialogo.
            const r112 = [...document.querySelectorAll('#baLista .renglon')].find(r => r.textContent.includes(e112.fields.Title));
            const btnAn112 = r112 && r112.querySelector('button[data-accion="anular"]');
            R.ok('C-23: la góndola en planta con folio ofrece Anular', !!btnAn112);
            if (btnAn112) {
                btnAn112.click(); await esperar(() => $('dlg').open, 'confirm de Anular');
                const llamadasAntes = DB.llamadas.length;
                clic('btnActualizar'); await dormir(120);
                R.ok('C-23: con el confirm de Anular abierto, Actualizar NO recarga las listas (0 llamadas a Graph, sin «Datos actualizados») y el diálogo sigue abierto', DB.llamadas.length === llamadasAntes && !avisoCon('Datos actualizados') && $('dlg').open, `llamadas ${llamadasAntes}→${DB.llamadas.length}`);
                R.ok('C-24: el botón Anular que disparó queda deshabilitado mientras dura (un segundo toque no abre otro confirm)', btnAn112.disabled);
                poner('dlgMotivo', 'Se pesó la góndola equivocada'); clic('dlgOk');
                await esperar(() => e112.fields.Etapa === 'anulado', 'anulado 112');
                await esperar(() => avisoCon('anulado. Para repesar'), 'aviso de anulado');
                const patches = DB.llamadas.filter(x => x === `PATCH /sites/sitio-falso/lists/lista-embarques/items/${e112.id}/fields`).length;
                R.ok('C-23: al confirmar, el PATCH escribe UNA vez, la góndola sale de «En planta» y el aviso se ve', e112.fields.Etapa === 'anulado' && !$('baLista').textContent.includes(e112.fields.Title) && patches >= 1 && !btnAn112.disabled, `patches ${patches}`);
            }
            // C-24: doble toque en Guardar del padron -> un solo carrier.
            document.querySelector('#pestanas button[data-p="padron"]').click();
            clic('btnNuevoCarrier'); await esperar(() => $('pdFormaCarrier').open, 'forma de carrier (doble toque)');
            poner('pcTitle', 'CARRIER DOBLE TOQUE');
            clic('btnGuardarCarrier'); clic('btnGuardarCarrier');
            R.ok('C-24: al primer toque «Guardar» queda deshabilitado', $('btnGuardarCarrier').disabled);
            await esperar(() => !$('pdFormaCarrier').open, 'carrier del doble toque guardado');
            await dormir(50);
            R.ok('C-24: un doble toque en Guardar crea UN solo carrier y el botón vuelve a habilitarse', filas('carriers').filter(c => c.fields.Title === 'CARRIER DOBLE TOQUE').length === 1 && !$('btnGuardarCarrier').disabled, `${filas('carriers').filter(c => c.fields.Title === 'CARRIER DOBLE TOQUE').length} renglón(es)`);
        }

        // 16. CERTIFICADO DE TRATAMIENTO (v0.35.0): un certificado por programa cerrado; solo gerencia emite, sustituye o
        // cancela; firma en PLANTA_Firmas (Tipo certificado); folio CT-AA-NNNN; QR con ?f=<folio>-<sufijo>; sin firma valida no
        // se imprime. Se cierra CLIENTE DEMO (todas sus gondolas ya salieron de planta) y se emite sobre sus cerrados.
        {
            document.querySelector('#pestanas button[data-p="prealtas"]').click();
            const rDemo = await esperar(() => [...document.querySelectorAll('#paFirmadas .renglon')].find(r => r.textContent.includes('CLIENTE DEMO')), 'renglón CLIENTE DEMO en firmadas');
            rDemo.querySelector('button').click(); await esperar(() => visible('paDetalle'), 'detalle de CLIENTE DEMO');
            R.ok('v0.35.0: un programa FIRMADO no ofrece emitir certificado (solo cerrado)', !visible('btnEmitirCertificado') && !visible('btnVerCertificado'));
            clic('btnCerrarPrealta'); await confirmar();
            await esperar(() => filas('prealtas').some(x => x.fields.Title === 'CLIENTE DEMO-POZO 1-2026' && x.fields.Estado === 'cerrada'), 'programa cerrado');
            const pDemo = filas('prealtas').find(x => x.fields.Title === 'CLIENTE DEMO-POZO 1-2026');
            const cerrados = filas('embarques').filter(e => Number(e.fields.PreAltaId) === pDemo.id && e.fields.Etapa === 'cerrado' && Number(e.fields.NetoKg) > 0);
            const kgEsperados = cerrados.reduce((a, e) => a + Number(e.fields.NetoKg), 0);
            $('paGrupoCerradas').open = true;
            const rCerr = await esperar(() => [...document.querySelectorAll('#paCerradas .renglon')].find(r => r.textContent.includes('CLIENTE DEMO')), 'renglón en cerradas');
            rCerr.querySelector('button').click(); await esperar(() => visible('paDetalle') && $('paDetalleTitulo').textContent.includes('cerrada'), 'detalle del programa cerrado');
            R.ok('v0.35.0: el detalle del programa cerrado dice «sin emitir»', $('paDetalleCertificado').textContent.includes('sin emitir'), $('paDetalleCertificado').textContent.slice(0, 80));
            if (ROL === 'gerencia') {
                R.ok('v0.35.0: gerencia ve «Emitir certificado de tratamiento» y no Sustituir/Cancelar (aún no hay)', visible('btnEmitirCertificado') && !$('btnEmitirCertificado').disabled && !visible('btnSustituirCertificado') && !visible('btnCancelarCertificado'));
                clic('btnEmitirCertificado'); await confirmar();
                await esperar(() => filas('certificados').length === 1, 'certificado creado');
                const c1 = filas('certificados')[0];
                await esperar(() => $('dlgCertificado').open, 'vista del certificado');
                const firmaC = filas('firmas').find(f => f.fields.Tipo === 'certificado' && Number(f.fields.ObjetoId) === c1.id);
                R.ok('v0.35.0: el renglón nace vigente con folio CT-AA-NNNN, la suma de netos, los folios de embarque y sufijo de 8', /^CT-\d\d-0001$/.test(c1.fields.Title) && c1.fields.Estado === 'vigente' && c1.fields.Kg === kgEsperados && c1.fields.Embarques.split(';').length === cerrados.length && /^[a-z2-9]{8}$/.test(c1.fields.Sufijo) && c1.fields.EmitidoPor === window.__CUENTA.username && c1.fields.Generador === pDemo.fields.Generador, `${c1.fields.Title} · ${c1.fields.Kg} kg (esperados ${kgEsperados}) · ${c1.fields.Embarques}`);
                R.ok('v0.35.0: la emisión deja su firma en PLANTA_Firmas (Tipo certificado, mismo firmante)', !!firmaC && firmaC.fields.Firmante === window.__CUENTA.username);
                const cert = $('certificado');
                const qr = cert.querySelector('svg.qr');
                R.ok('v0.35.0: el formato pinta folio, generador, volumen en toneladas, los incisos y el QR con la URL de verificación', cert.textContent.includes(c1.fields.Title) && cert.textContent.includes(pDemo.fields.Generador) && cert.textContent.includes((kgEsperados / 1000).toLocaleString('es-MX', { minimumFractionDigits: 2 })) && cert.querySelectorAll('.ct-incisos tr').length === cerrados.length + 1 && !!qr && !qr.dataset.sinLibreria && qr.querySelector('title').textContent === `https://planta.minsaenergy.com/certificado/?f=${c1.fields.Title}-${c1.fields.Sufijo}` && cert.textContent.includes('pendiente'), `incisos ${cert.querySelectorAll('.ct-incisos tr').length - 1} · qr ${!!qr}`);
                R.ok('v0.35.0: vigente y firmado → Imprimir habilitado', !$('ctImprimir').disabled && $('ctEstado').textContent.includes('firmado'));
                clic('ctCerrar'); await dormir(20);
                R.ok('v0.35.0: con uno vigente, Emitir se esconde y aparecen Ver / Sustituir / Cancelar', !visible('btnEmitirCertificado') && visible('btnVerCertificado') && visible('btnSustituirCertificado') && visible('btnCancelarCertificado') && $('paDetalleCertificado').textContent.includes(c1.fields.Title));
                // S-11 sobre el certificado: si la firma desaparece (o la creo alguien sin rol), se ve pero no se imprime.
                const idxF = filas('firmas').indexOf(firmaC); filas('firmas').splice(idxF, 1);
                clic('btnActualizar'); await esperar(() => avisoCon('Datos actualizados'), 'recarga sin la firma');
                rCerr.querySelector('button').click(); await dormir(20);
                clic('btnVerCertificado'); await esperar(() => $('dlgCertificado').open, 'vista sin firma');
                R.ok('v0.35.0 / S-11: sin firma en PLANTA_Firmas el certificado se ve pero Imprimir queda deshabilitado y el detalle marca «sin firma»', $('ctImprimir').disabled && $('ctEstado').textContent.includes('SIN FIRMA') && $('paDetalleCertificado').textContent.includes('sin firma'));
                clic('ctCerrar'); filas('firmas').push(firmaC);
                // Sustituir: nace CT-..-0002 con firma; el 0001 queda sustituido con SustituidoPor y motivo.
                clic('btnSustituirCertificado'); await confirmar('Generador mal escrito');
                await esperar(() => filas('certificados').length === 2, 'certificado sustituto');
                const c2 = filas('certificados')[1];
                await esperar(() => $('dlgCertificado').open, 'vista del sustituto'); clic('ctCerrar');
                R.ok('v0.35.0: Sustituir crea CT-..-0002 vigente y firmado y deja 0001 como «sustituido» con SustituidoPor y el motivo', /-0002$/.test(c2.fields.Title) && c2.fields.Estado === 'vigente' && c1.fields.Estado === 'sustituido' && c1.fields.SustituidoPor === c2.fields.Title && c1.fields.Motivo === 'Generador mal escrito' && c2.fields.Motivo.includes(c1.fields.Title) && !!filas('firmas').find(f => f.fields.Tipo === 'certificado' && Number(f.fields.ObjetoId) === c2.id), `${c1.fields.Estado} → ${c2.fields.Title}`);
                // Cancelar: pide motivo obligatorio; el vigente queda cancelado y vuelve a ofrecerse Emitir.
                clic('btnCancelarCertificado'); await esperar(() => $('dlg').open, 'confirm de cancelar');
                clic('dlgOk'); await dormir(30);
                R.ok('v0.35.0: cancelar sin motivo no procede (el motivo es obligatorio)', $('dlg').open && c2.fields.Estado === 'vigente');
                poner('dlgMotivo', 'Emitido por error'); clic('dlgOk');
                await esperar(() => c2.fields.Estado === 'cancelado', 'cancelado');
                R.ok('v0.35.0: Cancelar deja el renglón cancelado con quién, cuándo y motivo, y el programa vuelve a ofrecer Emitir', c2.fields.CanceladoPor === window.__CUENTA.username && !!c2.fields.CanceladoEl && c2.fields.Motivo === 'Emitido por error' && visible('btnEmitirCertificado') && !visible('btnSustituirCertificado'), `${c2.fields.Estado} · ${c2.fields.Motivo}`);
                clic('btnVerCertificado'); await esperar(() => $('dlgCertificado').open, 'vista del cancelado');
                R.ok('v0.35.0: un certificado cancelado se ve con el sello CANCELADO y no se imprime', $('certificado').classList.contains('cancelado') && $('certificado').textContent.includes('CANCELADO') && $('ctImprimir').disabled);
                clic('ctCerrar');
                // Un programa cerrado SIN cerrados con neto no emite nada.
                const kgAntes = cerrados.map(e => e.fields.NetoKg); cerrados.forEach(e => { e.fields.NetoKg = 0; });
                clic('btnEmitirCertificado'); await esperar(() => avisoCon('nada que certificar'), 'sin cerrados con neto');
                R.ok('v0.35.0: sin embarques cerrados con neto no se emite y lo dice', filas('certificados').length === 2 && !!avisoCon('nada que certificar'));
                cerrados.forEach((e, i) => { e.fields.NetoKg = kgAntes[i]; });
                clic('btnEmitirCertificado'); await confirmar();
                await esperar(() => filas('certificados').length === 3, 'tercer certificado');
                await esperar(() => $('dlgCertificado').open, 'vista del tercero'); clic('ctCerrar');
                R.ok('v0.35.0: tras cancelar se puede emitir otro y el folio sigue (CT-..-0003, nunca se reutiliza)', /-0003$/.test(filas('certificados')[2].fields.Title) && filas('certificados')[2].fields.Estado === 'vigente' && c2.fields.Estado === 'cancelado');
            } else {
                R.ok(`v0.35.0: el rol ${ROL} NO ve Emitir / Sustituir / Cancelar certificado (solo gerencia)`, !visible('btnEmitirCertificado') && !visible('btnSustituirCertificado') && !visible('btnCancelarCertificado'));
            }
            clic('btnVolverPrealtas'); await dormir(20);
        }

        // 14. Sesion caducada: acquireTokenSilent pide interaccion -> la app manda al login, no un error mudo.
        const pcaFalso = window.msal;
        let redirigio = false;
        pcaFalso.PublicClientApplication.prototype.acquireTokenSilent = async () => { throw new pcaFalso.InteractionRequiredAuthError('interaction_required'); };
        pcaFalso.PublicClientApplication.prototype.acquireTokenRedirect = async () => { redirigio = true; };
        clic('btnActualizar'); await esperar(() => redirigio || avisoCon('No se pudo actualizar'), 'token caducado');
        R.ok('token caducado → acquireTokenRedirect (vuelve al login)', redirigio);
    } else {
        R.log('nota', `rol ${ROL}: sin captura de puerta; se prueba solo lectura`);
        document.querySelector('#pestanas button[data-p="puerta"]').click();
        // U-38 (v0.26.0): el rol de lectura es texto fijo de la tarjeta, no un aviso (el refresco silencioso lo repetía cada 2 min).
        R.ok('rol de lectura: la compuerta está deshabilitada y lo dice la tarjeta, no un aviso', $('btnCompuerta').disabled && visible('puSoloLectura') && !avisoCon('Tu rol es de lectura'));
        R.ok('U-50: el texto de la Puerta nombra el rol real (validador ≠ lectura)', ROL === 'validador' ? $('puSoloLectura').textContent.includes('validador') && $('puSoloLectura').textContent.includes('Pre-altas') : $('puSoloLectura').textContent.includes('lectura'), $('puSoloLectura').textContent);
        document.querySelector('#pestanas button[data-p="padron"]').click();
        R.ok('rol de lectura: sin botones de alta en el padrón', !visible('btnNuevoCarrier') && !visible('btnNuevaUnidad'));
        R.ok('v0.35.0: los botones del certificado existen y están ocultos para un rol que no captura', !!$('btnEmitirCertificado') && !visible('btnEmitirCertificado') && !visible('btnVerCertificado') && !visible('btnCancelarCertificado'));
        await probarArchivos(null);   // v0.33.0: Archivos la ven todos los roles
    }
} catch (e) {
    R.ok('la corrida terminó sin excepción', false, (e && e.stack) || String(e));
} finally {
    R.ok('ningún texto > 255 llegó a Graph en toda la corrida (el falso lo rechaza como SharePoint)', window.__DB.textoLargo.length === 0, window.__DB.textoLargo.join('|'));
    R.ok('U-36: ningún «(s)» en el texto que quedó pintado', !/\w\(s\)/.test($('app-real').textContent), ($('app-real').textContent.match(/.{0,20}\w\(s\).{0,10}/g) || []).join(' | '));
    R.ok('U-32: #avisos es región viva', $('avisos').getAttribute('role') === 'status' && ['polite', 'assertive'].includes($('avisos').getAttribute('aria-live')));
    await R.cerrar();
    // ?vista=padron oculta la bitacora y deja esa pestana abierta: para una captura de pantalla.
    // Los <dialog> que la corrida dejo abiertos (el detalle de la firmada del paso 12c) taparian la captura.
    if (params.get('vista') === 'certificado') {
        // v0.35.0: para la captura y el print-to-pdf del formato FO-CT-01 — el detalle del programa cerrado con su certificado vigente abierto.
        $('resultados').hidden = true; for (const d of document.querySelectorAll('dialog[open]')) d.close();
        document.querySelector('#pestanas button[data-p="prealtas"]').click(); $('paGrupoCerradas').open = true;
        const r = [...document.querySelectorAll('#paCerradas .renglon')].find(x => x.textContent.includes('CLIENTE DEMO'));
        if (r) { r.querySelector('button').click(); await dormir(30); clic('btnVerCertificado'); await dormir(30); if (params.get('imprimir')) { document.body.classList.add('imprimiendo-certificado'); $('cssImpresionCert').disabled = false; } }
    } else if (params.get('vista')) { $('resultados').hidden = true; for (const d of document.querySelectorAll('dialog[open]')) d.close(); document.querySelector(`#pestanas button[data-p="${params.get('vista')}"], #pestanasExtra button[data-p="${params.get('vista')}"]`).click(); }
}
</script>
</body>
</html>
